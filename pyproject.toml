[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-screening-agent"
dynamic = ["version"]
description = "Sàng lọc CV theo JD bằng luật (không LLM, chạy cục bộ), có giao diện web cho HR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=10", "rapidocr-onnxruntime>=1.3"]
eval = ["pandas>=2.0", "scipy>=1.10"]
llm = ["anthropic>=0.40"]
dev = ["pyflakes"]

[project.scripts]
cv-agent = "run:main"
cv-agent-web = "serve:main"

[tool.setuptools]
py-modules = ["run", "serve"]

[tool.setuptools.packages.find]
include = ["cv_agent*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "cv_agent.__version__" }
